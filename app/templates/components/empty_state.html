{% macro empty_state(title, description, icon="layout-template") %}
  <div class="empty-state">
    <span class="empty-state-icon" aria-hidden="true">
      <i data-lucide="{{ icon }}"></i>
    </span>
    <h2>{{ title }}</h2>
    <p>{{ description }}</p>
    <span class="badge badge--neutral">Em breve</span>
  </div>
{% endmacro %}
